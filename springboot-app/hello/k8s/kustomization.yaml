apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomization이 관리할 리소스 목록을 정의
resources:
- hello-app-namespace.yaml
- hello-app-deployment.yaml
- hello-app-service.yaml
# 본인의 도커 허브 사용자 이름으로 변경 ,깃허브변경됬다고 쿠버네티스에게 알려주는녀석
images:
- name: mrhwang/hello-app
  newName: mrhwang/hello-app
  newTag: bef60dd
