apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgd
  namespace: bgd
  labels:
    app: bgd
spec:
  replicas: 4
  selector:
    matchLabels:
      app: bgd

  template:
    metadata:
      labels:
        app: bgd          #서비스의 라벨과 일치, matchLabes와 일치.4
      creationTimestamp: null
    spec:
      containers:
      - name: bgd
        image: quay.io/rhdevelopers/bgd:1.0.0
        env:
        - name: COLOR
          value: "red"